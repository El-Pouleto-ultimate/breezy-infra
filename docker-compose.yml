services:

  # ─── NGINX ──────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: breezy-nginx
    ports:
      - "80:80"
    networks:
      - breezy-network
    depends_on:
      - frontend
      - gateway

  # ─── FRONTEND ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../breezy-frontend
      dockerfile: Dockerfile
    container_name: breezy-frontend
    expose:
      - "${FRONTEND_PORT}"
    volumes:
      - ../breezy-frontend:/app
      - /app/node_modules
    networks:
      - breezy-network

  # ─── GATEWAY ────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: breezy-gateway
    expose:
      - "${GATEWAY_PORT}"
    environment:
      - PORT=${GATEWAY_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - POST_SERVICE_URL=${POST_SERVICE_URL}
      - PROFIL_SERVICE_URL=${PROFIL_SERVICE_URL}
    networks:
      - breezy-network
    depends_on:
      - auth-service
      - user-service
      - post-service
      - profil-service

  # ─── SERVICES BACKEND ───────────────────────────────────────────────────────
  auth-service:
    build:
      context: ../breezy-auth-service
      dockerfile: Dockerfile
    container_name: breezy-auth
    expose:
      - "${AUTH_PORT}"
    environment:
      - PORT=${AUTH_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${AUTH_DB_URL}
    volumes:
      - ../breezy-auth-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - pg-auth

  user-service:
    build:
      context: ../breezy-user-service
      dockerfile: Dockerfile
    container_name: breezy-user
    expose:
      - "${USER_PORT}"
    environment:
      - PORT=${USER_PORT}
      - DATABASE_URL=${USER_DB_URL}
    volumes:
      - ../breezy-user-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - pg-users

  post-service:
    build:
      context: ../breezy-post-service
      dockerfile: Dockerfile
    container_name: breezy-post
    expose:
      - "${POST_PORT}"
    environment:
      - PORT=${POST_PORT}
      - MONGO_URI=${POST_DB_URL}
    volumes:
      - ../breezy-post-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - mongo-posts

  profil-service:
    build:
      context: ../breezy-profil-service
      dockerfile: Dockerfile
    container_name: breezy-profil
    expose:
      - "${PROFIL_PORT}"
    environment:
      - PORT=${PROFIL_PORT}
      - MONGO_URI=${PROFIL_DB_URL}
    volumes:
      - ../breezy-profil-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - mongo-profils

  # ─── BASES DE DONNÉES ───────────────────────────────────────────────────────
  pg-auth:
    image: postgres:15-alpine
    container_name: breezy-db-pg-auth
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - breezy-network

  pg-users:
    image: postgres:15-alpine
    container_name: breezy-db-pg-users
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    networks:
      - breezy-network

  mongo-posts:
    image: mongo:6
    container_name: breezy-db-mongo-posts
    volumes:
      - mongo_posts_data:/data/db
    networks:
      - breezy-network

  mongo-profils:
    image: mongo:6
    container_name: breezy-db-mongo-profils
    volumes:
      - mongo_profils_data:/data/db
    networks:
      - breezy-network

# ─── VOLUMES ──────────────────────────────────────────────────────────────────
volumes:
  pg_auth_data:
  pg_users_data:
  mongo_posts_data:
  mongo_profils_data:

# ─── RÉSEAU ───────────────────────────────────────────────────────────────────
networks:
  breezy-network:
    driver: bridge