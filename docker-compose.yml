services:

  # ─── NGINX ──────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: breezy-nginx
    ports:
      - "80:80"
    networks:
      - breezy-network
    depends_on:
      - frontend
      - gateway

  # ─── FRONTEND ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../breezy-frontend
      dockerfile: Dockerfile
    container_name: breezy-frontend
    expose:
      - "5173"
    volumes:
      - ../breezy-frontend:/app
      - /app/node_modules
    networks:
      - breezy-network

  # ─── GATEWAY ────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: breezy-gateway
    expose:
      - "3000"
    environment:
      - PORT=3000
      - JWT_SECRET=CACACACACACACACA
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - POST_SERVICE_URL=http://post-service:3003
      - PROFIL_SERVICE_URL=http://profil-service:3004
    networks:
      - breezy-network
    depends_on:
      - auth-service
      - user-service
      - post-service
      - profil-service

  # ─── SERVICES BACKEND ───────────────────────────────────────────────────────
  auth-service:
    build:
      context: ../breezy-auth-service
      dockerfile: Dockerfile
    container_name: breezy-auth
    expose:
      - "3001"
    environment:
      - PORT=3001
      - JWT_SECRET=CACACACACACACACA
      - DATABASE_URL=postgres://user:auth-password@pg-auth:5432/auth_db
    volumes:
      - ../breezy-auth-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - pg-auth

  user-service:
    build:
      context: ../breezy-user-service
      dockerfile: Dockerfile
    container_name: breezy-user
    expose:
      - "3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgres://user:user-password@pg-users:5432/users_db
    volumes:
      - ../breezy-user-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - pg-users

  post-service:
    build:
      context: ../breezy-post-service
      dockerfile: Dockerfile
    container_name: breezy-post
    expose:
      - "3003"
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongo-posts:27017/posts_db
    volumes:
      - ../breezy-post-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - mongo-posts

  profil-service:
    build:
      context: ../breezy-profil-service
      dockerfile: Dockerfile
    container_name: breezy-profil
    expose:
      - "3004"
    environment:
      - PORT=3004
      - MONGO_URI=mongodb://mongo-profils:27017/profils_db
    volumes:
      - ../breezy-profil-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    depends_on:
      - mongo-profils

  # ─── BASES DE DONNÉES ───────────────────────────────────────────────────────
  pg-auth:
    image: postgres:15-alpine
    container_name: breezy-db-pg-auth
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: auth-password
      POSTGRES_DB: auth_db
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - breezy-network

  pg-users:
    image: postgres:15-alpine
    container_name: breezy-db-pg-users
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user-password
      POSTGRES_DB: users_db
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    networks:
      - breezy-network

  mongo-posts:
    image: mongo:6
    container_name: breezy-db-mongo-posts
    volumes:
      - mongo_posts_data:/data/db
    networks:
      - breezy-network

  mongo-profils:
    image: mongo:6
    container_name: breezy-db-mongo-profils
    volumes:
      - mongo_profils_data:/data/db
    networks:
      - breezy-network

# ─── VOLUMES ──────────────────────────────────────────────────────────────────
volumes:
  pg_auth_data:
  pg_users_data:
  mongo_posts_data:
  mongo_profils_data:

# ─── RÉSEAU ───────────────────────────────────────────────────────────────────
networks:
  breezy-network:
    driver: bridge