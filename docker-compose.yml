services:

  # ─── NGINX ──────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: breezy-nginx
    ports:
      - "80:80"
    networks:
      - breezy-network
    depends_on:
      - frontend
      - gateway

  # ─── FRONTEND ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../breezy-frontend
      dockerfile: Dockerfile
    container_name: breezy-frontend
    expose:
      - "${FRONTEND_PORT}"
    networks:
      - breezy-network

  # ─── GATEWAY ────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: breezy-gateway
    expose:
      - "${GATEWAY_PORT}"
    environment:
      - NODE_ENV=test
      - PORT=${GATEWAY_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - POST_SERVICE_URL=${POST_SERVICE_URL}
      - PROFIL_SERVICE_URL=${PROFIL_SERVICE_URL}
    networks:
      - breezy-network
    depends_on:
      - auth-service
      - user-service
      - post-service
      - profil-service

  # ─── SERVICES BACKEND ───────────────────────────────────────────────────────
  auth-service:
    build:
      context: ../breezy-auth-service
      dockerfile: Dockerfile
    container_name: breezy-auth
    expose:
      - "${AUTH_PORT}"
    environment:
      - PORT=${AUTH_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${AUTH_DB_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ../breezy-auth-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    restart: on-failure
    depends_on:
      pg-auth:
        condition: service_healthy

  user-service:
    build:
      context: ../breezy-user-service
      dockerfile: Dockerfile
    container_name: breezy-user
    expose:
      - "${USER_PORT}"
    environment:
      - PORT=${USER_PORT}
      - DATABASE_URL=${USER_DB_URL}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - PROFIL_SERVICE_URL=${PROFIL_SERVICE_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ../breezy-user-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    restart: on-failure
    depends_on:
      pg-users:
        condition: service_healthy

  post-service:
    build:
      context: ../breezy-post-service
      dockerfile: Dockerfile
    container_name: breezy-post
    expose:
      - "${POST_PORT}"
    environment:
      - PORT=${POST_PORT}
      - MONGO_URI=${POST_DB_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - PROFIL_SERVICE_URL=${PROFIL_SERVICE_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ../breezy-post-service:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - breezy-network
    restart: on-failure
    depends_on:
      mongo-posts:
        condition: service_healthy

  profil-service:
    build:
      context: ../breezy-profil-service
      dockerfile: Dockerfile
    container_name: breezy-profil
    expose:
      - "${PROFIL_PORT}"
    environment:
      - PORT=${PROFIL_PORT}
      - MONGO_URI=${PROFIL_DB_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ../breezy-profil-service:/app
      - /app/node_modules
    networks:
      - breezy-network
    restart: on-failure
    depends_on:
      mongo-profils:
        condition: service_healthy

  # ─── SEED ────────────────────────────────────────────────────────────────────
  seed:
    build:
      context: ./seed
      dockerfile: Dockerfile
    container_name: breezy-seed
    environment:
      - GATEWAY_URL=http://gateway:3000/api
      - SEED_ROLE_MODE=psql
      - AUTH_DATABASE_URL=postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@pg-auth:5432/${AUTH_DB_NAME}
    networks:
      - breezy-network
    restart: "no"
    depends_on:
      gateway:
        condition: service_started
      pg-auth:
        condition: service_healthy
      pg-users:
        condition: service_healthy
      mongo-posts:
        condition: service_healthy
      mongo-profils:
        condition: service_healthy

  # ─── BASES DE DONNÉES ───────────────────────────────────────────────────────
  pg-auth:
    image: postgres:15-alpine
    container_name: breezy-db-pg-auth
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - breezy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-users:
    image: postgres:15-alpine
    container_name: breezy-db-pg-users
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    networks:
      - breezy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-posts:
    image: mongo:6
    container_name: breezy-db-mongo-posts
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_posts_data:/data/db
    networks:
      - breezy-network
    healthcheck:
      # CMD-SHELL : le shell du conteneur expand $MONGO_INITDB_ROOT_USERNAME
      # et $MONGO_INITDB_ROOT_PASSWORD (variables injectées via "environment:" ci-dessus).
      # Évite les problèmes d'interpolation Docker Compose avec la forme CMD pure.
      # start_period : laisse 10 s à MongoDB pour initialiser l'admin user
      # avant que les échecs comptent dans les retries.
      test: ["CMD-SHELL", "mongosh --quiet -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 10

  mongo-profils:
    image: mongo:6
    container_name: breezy-db-mongo-profils
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_profils_data:/data/db
    networks:
      - breezy-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 10

# ─── VOLUMES ──────────────────────────────────────────────────────────────────
volumes:
  pg_auth_data:
  pg_users_data:
  mongo_posts_data:
  mongo_profils_data:
  uploads_data:

# ─── RÉSEAU ───────────────────────────────────────────────────────────────────
networks:
  breezy-network:
    driver: bridge