worker_processes auto;

events {
    worker_connections 1024; # Nombre maximum de connexions simultanées par worker
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ─── RATE LIMITING ───────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;


    server {
        listen 80; # NGINX écoute sur le port 80
        server_name localhost; # Nom du serveur pour l'environnement local

        # Toutes les requêtes qui commencent par /api/ sont redirigées vers l'API Gateway
        location /api/ {
            proxy_pass http://gateway:3000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Timeout : si la gateway ne répond pas en 30s = erreur
            proxy_connect_timeout 30s;
            proxy_read_timeout    30s;
        }

        # Tout le reste (/) est redirigé vers le frontend React
        location / {
            proxy_pass http://frontend:3000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}